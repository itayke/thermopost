## Managed dependencies for the thermopost main component.
## Pulled at build time by `idf.py reconfigure` into ./managed_components/.
##
## Kept deliberately thin: the panel, touch, LVGL and codec dependencies are
## added when the code that needs them lands — and *which* panel/touch driver we
## ask for depends on what the bring-up probe finds, so committing to one now
## would be guessing.

dependencies:
  idf:
    version: ">=5.5,<6.0"

  ## LittleFS VFS layer — the temperature log lives on the `storage` partition.
  joltwallet/littlefs: "^1.16.4"

  ## ES8311 codec driver + the volume/gain abstraction over it. Hand-rolling the
  ## ES8311's ~20-register power-up sequence is the one part of the audio path
  ## with no feedback loop short of "is the speaker silent", so it goes to the
  ## driver Espressif maintains.
  espressif/esp_codec_dev: "^1.3.1"
